name: Busca diária de licitações

on:
  schedule:
    # 09:00 no horário de Mato Grosso do Sul (UTC-4) = 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch:
    # permite clicar em "Run workflow" manualmente na aba Actions do GitHub
    inputs:
      dias_retroativos:
        description: "Quantos dias para trás buscar (deixe em branco para usar o padrão de 2 dias)"
        required: false
        type: string
      somente_orgaos:
        description: "Buscar só órgãos por CNPJ (ex: AGESUL), pulando os municípios"
        required: false
        type: boolean
        default: false

jobs:
  buscar-e-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o script de busca
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          DIAS_RETROATIVOS_OVERRIDE: ${{ inputs.dias_retroativos }}
          SOMENTE_ORGAOS: ${{ inputs.somente_orgaos }}
        run: python buscar_licitacoes.py
